name: Test and publish gallery
on:
  push:
    branches: [main, gallery-integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node qa/check.mjs
      - name: Browser acceptance
        run: |
          npm install --prefix "$RUNNER_TEMP/gallery-qa" playwright@1.56.1
          "$RUNNER_TEMP/gallery-qa/node_modules/.bin/playwright" install --with-deps chromium
          node qa/preview.mjs &
          server=$!
          trap 'kill "$server"' EXIT
          curl --retry 12 --retry-delay 1 --retry-connrefused --fail http://127.0.0.1:5186/ --output /dev/null
          NODE_PATH="$RUNNER_TEMP/gallery-qa/node_modules" node qa/browser.cjs
      - name: Verify the live visitor service accepts Pages
        run: node qa/live.mjs
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: docs
  publish:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
