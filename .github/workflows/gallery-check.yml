name: Gallery release checks
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check public catalogue, all photo sizes and visitor service
        shell: python
        run: |
          import concurrent.futures, io, json, re, urllib.request
          from PIL import Image
          base = 'https://i-was-here-photography.shenliwangxu.chatgpt.site/'
          pages = 'https://iwashere-gallery.github.io'
          def get(path):
              with urllib.request.urlopen(base + path, timeout=60) as response:
                  return response.read()
          catalog = json.loads(get('api/gallery'))
          assert catalog and len({p['id'] for p in catalog}) == len(catalog)
          def check(p):
              for kind, prefix in [('preview','preview'),('detail','detail'),('signed','original')]:
                  path = p[kind]
                  assert re.fullmatch(r'(?:api/)?media/[a-zA-Z0-9_-]+[.]jpg', path)
                  with Image.open(io.BytesIO(get(path))) as photo:
                      assert photo.format == 'JPEG' and photo.size == (p[prefix+'Width'], p[prefix+'Height']), (p['id'], kind, photo.size)
                      photo.verify()
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              list(pool.map(check, catalog))
          print(f'Validated {len(catalog)} photographs and {3*len(catalog)} JPEG assets', flush=True)
          for path in ['visits','works/'+catalog[0]['id']+'/view','works/'+catalog[0]['id']+'/messages','works/'+catalog[0]['id']+'/download']:
              request = urllib.request.Request(base+'api/'+path,method='OPTIONS',headers={'Origin': pages,'Access-Control-Request-Method':'POST','Access-Control-Request-Headers':'content-type'})
              with urllib.request.urlopen(request,timeout=20) as response:
                  assert response.headers.get('Access-Control-Allow-Origin') == pages, path
